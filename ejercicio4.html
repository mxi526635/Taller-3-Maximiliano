<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Ejercicio 4: formulario de registro con los campos nombre, correo, telefono, direccion, codigo postal e ID de usuario">
  <meta name="keywords" content="HTML, CSS, formulario, registro, ejercicio 4">
  <meta name="user" content="Maximiliano">
  <title>Ejercicio # 4</title>
  <link rel="stylesheet" href="css/ejercicio4.css">
</head>
<body>

<h1>Formulario con Validaciones Avanzadas</h1>

<form id="formulario">

  <p>
    <label for="nombre">Nombre Completo:</label>
    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan P&eacute;rez G&oacute;mez" size="30">
  </p>

  <p>
    <label for="correo">Correo Electr&oacute;nico:</label>
    <input type="text" id="correo" name="correo" placeholder="Ej: usuario@correo.com" size="30">
  </p>

  <p>
    <label for="telefono">Tel&eacute;fono:</label>
    <input type="text" id="telefono" name="telefono" placeholder="Ej: +52 55 1234 5678" size="30">
  </p>

  <p>
    <label for="direccion">Direcci&oacute;n:</label>
    <input type="text" id="direccion" name="direccion" placeholder="Ej: Calle 123, Colonia Centro" size="30">
  </p>

  <p>
    <label for="codigo">C&oacute;digo Postal:</label>
    <input type="text" id="codigo" name="codigo" placeholder="Ej: 28001" size="30">
  </p>

  <p>
    <label for="usuario">ID de Usuario:</label>
    <input type="text" id="usuario" name="usuario" placeholder="Ej: User123" size="30">
  </p>

  <p>
    <button type="submit">Enviar</button>
    <button type="reset" id="restablecer">Restablecer</button>
  </p>

</form>

<p class="enlaceVolver"><a href="index.html">Volver al Menu Principal</a></p>

</body>
</html>
